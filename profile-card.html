<title>deveshyaara@github</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--card:#0a0e14;--border:#1f2937;--fg:#e6edf3;--dim:#8b949e;--blue:#58a6ff;--orange:#e3b341;--green:#3fb950;--dots:#3b4452}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f8fa;--card:#ffffff;--border:#d0d7de;--fg:#1f2328;--dim:#57606a;--blue:#0969da;--orange:#9a6700;--green:#2da44e;--dots:#b6bec8}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.65 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;padding:20px}
.card{display:flex;gap:28px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:22px;max-width:1120px;width:100%}
.left{flex:0 0 auto;line-height:0}
canvas{display:block;max-width:100%;height:auto}
.right{flex:1;min-width:0;padding-top:4px}
.head{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:700;margin-bottom:6px}
.head::after{content:"";flex:1;border-top:1px solid var(--border)}
.sec{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:700;margin:16px 0 4px}
.sec::after{content:"";flex:1;border-top:1px solid var(--border)}
.row{display:flex;align-items:baseline;gap:6px;opacity:0;animation:in .35s forwards}
.row .k{color:var(--orange);white-space:nowrap}
.row .lead{flex:1;border-bottom:1px dotted var(--dots);transform:translateY(-4px);min-width:12px}
.row .v{color:var(--fg);text-align:right;overflow-wrap:anywhere}
.row .v.na{color:var(--dim)}
.cols{display:grid;grid-template-columns:1fr auto 1fr;gap:0 14px;opacity:0;animation:in .35s forwards}
.cols .bar{color:var(--dim);grid-row:1;grid-column:2;align-self:stretch;display:flex;flex-direction:column}
.cols .col .row{opacity:1;animation:none}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:10px;opacity:0;animation:in .35s forwards}
.spark i{width:6px;background:var(--green);border-radius:1px;display:block}
.cursor{display:inline-block;width:8px;height:15px;background:var(--fg);vertical-align:-2px;animation:blink 1.05s steps(1) infinite;margin-top:10px}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (max-width:800px){
 body{align-items:flex-start}
 .card{flex-direction:column;gap:18px;padding:16px}
 .left{align-self:center;width:100%}
 canvas{margin:0 auto}
 .cols{grid-template-columns:1fr}
 .cols .bar{display:none}
}
@media (prefers-reduced-motion:reduce){.row,.cols,.spark{animation:none;opacity:1}.cursor{animation:none}}
</style>
</head>

let delay = 0;
const stagger = el => { el.style.animationDelay = (delay += 80) + "ms"; return el; };
const isNA = v => /^not (available|verified)$/i.test(v);
function row(label, value, live) {
  const r = stagger($("div", "row"));
  r.append($("span", "k", ". " + label + ":"), $("span", "lead"));
  const v = $("span", "v" + (isNA(value) ? " na" : ""), value);
  if (live) v.id = "uptime";
  r.append(v); return r;
}
info.append(stagger($("div", "head", CONFIG.handle + "@github")));
const up = row("Uptime", "", true); info.append(up);
info.append(row("Location", CONFIG.location), row("Languages", CONFIG.languages));
info.append(stagger($("div", "sec", "Contact")));
for (const k in CONFIG.contact) info.append(row(k, CONFIG.contact[k]));
info.append(stagger($("div", "sec", "GitHub Stats")));
const cols = stagger($("div", "cols")), cl = $("div", "col"), cr = $("div", "col"), bar = $("div", "bar", "|\n|\n|\n|");
bar.style.whiteSpace = "pre";
for (const k in CONFIG.statsLeft) cl.append(row(k, CONFIG.statsLeft[k]));
for (const k in CONFIG.statsRight) cr.append(row(k, CONFIG.statsRight[k]));
cols.append(cl, bar, cr); info.append(cols);
info.append(row("Top repo", CONFIG.topRepo));
info.append(stagger($("div", "sec", "Last 12 Months")));
const l = CONFIG.last12, lk = Object.keys(l);
const c2 = stagger($("div", "cols")), a = $("div", "col"), b = $("div", "col");
a.append(row(lk[0], l[lk[0]])); b.append(row(lk[1], l[lk[1]]));
c2.append(a, $("div", "bar", "|"), b); info.append(c2);
const spark = stagger($("div", "spark"));
let s = 7;
for (let i = 0; i < CONFIG.sparkBars; i++) {
  s = (s * 9301 + 49297) % 233280;
  const h = 4 + Math.round((s / 233280) * 26);
  const bi = $("i"); bi.style.height = h + "px"; bi.style.marginRight = (s % 3) + "px";
  bi.style.opacity = 0.55 + (s % 45) / 100; spark.append(bi);
}
info.append(spark, $("span", "cursor"));

/* live uptime */
const start = new Date(CONFIG.uptimeStart);
const upEl = document.getElementById("uptime");
function tick() {
  if (isNaN(start)) { upEl.textContent = CONFIG.uptimeStart; upEl.classList.add("na"); return; }
  const n = new Date(); let y = n.getFullYear() - start.getFullYear(), m = n.getMonth() - start.getMonth(), d = n.getDate() - start.getDate();
  if (d < 0) { m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const p = x => String(x).padStart(2, "0");
  upEl.textContent = `${y}y ${m}m ${d}d ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
tick(); if (!isNaN(start)) setInterval(tick, 1000);

/* ============ PORTRAIT ============ */
const cv = document.getElementById("portrait");
cv.setAttribute("aria-label", "Portrait of " + CONFIG.name);
const ctx = cv.getContext("2d");
const W = COLS * CW, H = ROWS * CH;
let bright, fringe, rowStr, rowSpeed, rowPhase, ready = false;

function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + "px"; cv.style.aspectRatio = W + " / " + H;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `700 ${CH * 0.95}px "JetBrains Mono", monospace`;
  ctx.textBaseline = "top";
}
window.addEventListener("resize", setupCanvas);

function analyse(img) {
  const off = document.createElement("canvas"); off.width = COLS; off.height = ROWS;
  const o = off.getContext("2d", { willReadFrequently: true });
  o.imageSmoothingQuality = "high"; o.drawImage(img, 0, 0, COLS, ROWS);
  const d = o.getImageData(0, 0, COLS, ROWS).data;
  bright = new Float32Array(COLS * ROWS); fringe = new Float32Array(COLS * ROWS);
  const lum = new Float32Array(COLS * ROWS), isBg = new Uint8Array(COLS * ROWS);
  for (let i = 0; i < COLS * ROWS; i++) {
    const r = d[i * 4], g = d[i * 4 + 1], bl = d[i * 4 + 2];
    lum[i] = (0.299 * r + 0.587 * g + 0.114 * bl) / 255;
    isBg[i] = (bl > r + 60 && bl > g + 60) ? 1 : 0;      // saturated blue backdrop
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const i = y * COLS + x;
    if (isBg[i]) { bright[i] = 0; continue; }
    let v = Math.pow(lum[i], GAMMA);
    v = (v - 0.5) * CONTRAST + 0.5;
    v = Math.min(1, Math.max(HAIR_FLOOR, v));            // keep hair/beard/glasses visible
    bright[i] = v > THRESHOLD ? v : 0;
    // edge cell = subject cell touching background -> coloured fringe
    const nb = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => {
      const xx = x + dx, yy = y + dy;
      return xx < 0 || yy < 0 || xx >= COLS || yy >= ROWS || isBg[yy * COLS + xx];
    });
    fringe[i] = nb ? 1 : 0;
  }
}

function buildStreams() {
  rowStr = []; rowSpeed = []; rowPhase = [];
  for (let y = 0; y < ROWS; y++) {
    const L = COLS * 3; let str = "";
    for (let i = 0; i < L; i++) str += Math.random() < 0.5 ? "0" : "1";
    rowStr.push(str);
    rowSpeed.push(MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED));
    rowPhase.push(Math.random() * L);
  }
}

let last = 0, t0 = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!ready || ts - last < 1000 / FPS) return;
  last = ts; if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  const dark = !window.matchMedia("(prefers-color-scheme: light)").matches;
  const base = dark ? [230, 237, 243] : [31, 35, 40];
  const tintA = dark ? [88, 200, 255] : [9, 105, 218], tintB = dark ? [63, 220, 130] : [26, 127, 55];
  for (let y = 0; y < ROWS; y++) {
    const s = rowStr[y], L = s.length;
    const shift = rowPhase[y] + t * rowSpeed[y];          // always increasing -> left-to-right flow
    const whole = Math.floor(shift), frac = shift - whole;
    for (let x = 0; x < COLS; x++) {
      const i = y * COLS + x, v = bright[i];
      if (!v) continue;
      const idx = (((x - whole) % L) + L) % L;
      const ch = s[idx];
      let c = base, a = 0.12 + 0.88 * v;
      if (fringe[i]) { const m = (x + y) % 2 ? tintA : tintB; c = m; a = Math.max(a, 0.7); }
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(2)})`;
      ctx.fillText(ch, (x + frac) * CW, y * CH);
    }
  }
}

setupCanvas();
const img = new Image();
img.onload = () => { analyse(img); buildStreams(); ready = true; };
img.src = PHOTO;
requestAnimationFrame(frame);
</script>
</body>
</html>
